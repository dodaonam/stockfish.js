name: Release LC0 Bot Setup

on:
  push:
    branches: [main]
    paths:
      - "lc0-bot-extension/**"
      - ".github/workflows/release-lc0-bot.yml"

permissions:
  contents: write

concurrency:
  group: release-lc0-bot-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: lc0-bot-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        run: |
          python -m py_compile native_host.py
          Get-Content -Raw extension/manifest.json | ConvertFrom-Json | Out-Null
          Get-ChildItem extension -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.FullName)" }
          }

      - name: Build native host
        run: .\build-native-host.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Set daily version
        id: version
        run: |
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.dd')
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=lc0bot-v$version" >> $env:GITHUB_OUTPUT

      - name: Build setup executable
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" LC0Bot.iss

      - name: Create or update daily release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ASSET_PATH: lc0-bot-extension/dist/LC0Bot-Setup-${{ steps.version.outputs.value }}.exe
          ASSET_NAME: LC0Bot-Setup-${{ steps.version.outputs.value }}.exe
        working-directory: .
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
            foreach ($asset in $release.assets) {
              if ($asset.name -ne $env:ASSET_NAME) {
                gh release delete-asset $env:RELEASE_TAG $asset.name --yes --repo $env:GITHUB_REPOSITORY
              }
            }
            gh release upload $env:RELEASE_TAG $env:ASSET_PATH --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $env:ASSET_PATH --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "LC0 Bot Setup $env:RELEASE_VERSION" --notes "Automated Windows setup build from commit $env:GITHUB_SHA."
          }
