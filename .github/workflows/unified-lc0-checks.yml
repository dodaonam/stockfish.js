name: Unified LC0 extension checks

on:
  pull_request:
    paths:
      - "unified-lc0-bot/**"
      - ".github/workflows/unified-lc0-checks.yml"
  push:
    branches:
      - "feature/unified-lc0-chesscom-lichess"
    paths:
      - "unified-lc0-bot/**"
      - ".github/workflows/unified-lc0-checks.yml"

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js adapter and integration tests
        run: node --test unified-lc0-bot/tests/*.test.js
      - name: Native host tests
        run: python3 -m unittest discover -s unified-lc0-bot/host/tests -p 'test_*.py' -v
      - name: Ubuntu installer syntax
        run: bash -n unified-lc0-bot/scripts/install-ubuntu.sh
      - name: Python syntax
        run: python3 -m py_compile unified-lc0-bot/host/native_host.py unified-lc0-bot/scripts/smoke-engine.py
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node.js adapter, integration and regression tests
        run: node --test unified-lc0-bot/tests/adapter-chesscom.test.js unified-lc0-bot/tests/adapter-lichess.test.js unified-lc0-bot/tests/integration.test.js unified-lc0-bot/tests/regressions.test.js
      - name: Cross-platform native host protocol tests
        shell: pwsh
        run: python -m unittest discover -s unified-lc0-bot/host/tests -p 'test_*.py' -v
      - name: Python syntax
        shell: pwsh
        run: python -m py_compile unified-lc0-bot/host/native_host.py unified-lc0-bot/scripts/smoke-engine.py
