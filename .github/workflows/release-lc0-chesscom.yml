name: Release LC0 Chess.com Setup

on:
  push:
    branches: [main]
    paths:
      - "apps/lc0/chesscom/host/**"
      - "apps/lc0/chesscom/packaging/windows/**"
      - ".github/workflows/release-lc0-chesscom.yml"

permissions:
  contents: write

concurrency:
  group: release-lc0-bot-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/lc0/chesscom
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        run: |
          python -m py_compile host/native_host.py
          Get-Content -Raw extension/manifest.json | ConvertFrom-Json | Out-Null
          Get-ChildItem extension -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.FullName)" }
          }

      - name: Build native host
        run: .\packaging\windows\build-native-host.ps1

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compute unique release version
        id: version
        run: |
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.dd') + '.' + $env:GITHUB_RUN_NUMBER
          $tag = 'lc0bot-v{0}-r{1}' -f $version, $env:GITHUB_RUN_ATTEMPT
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build setup executable
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" packaging\windows\LC0Bot.iss

      - name: Validate and publish commit-bound GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ASSET_PATH: apps/lc0/chesscom/dist/LC0Bot-Setup-${{ steps.version.outputs.value }}.exe
          ASSET_NAME: LC0Bot-Setup-${{ steps.version.outputs.value }}.exe
        working-directory: .
        run: |
          if (-not (Test-Path -LiteralPath $env:ASSET_PATH -PathType Leaf)) { throw "Missing Setup executable: $env:ASSET_PATH" }
          if ((Get-Item -LiteralPath $env:ASSET_PATH).Length -le 0) { throw "Setup executable is empty." }
          $hash = (Get-FileHash -LiteralPath $env:ASSET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Split-Path -Parent $env:ASSET_PATH) "SHA256SUMS.txt"
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA/apps/lc0/chesscom/extension"
          $notes = @(
            "Automated Windows Native Messaging host installer from main commit $env:GITHUB_SHA.",
            "",
            "This release contains the native host installer; it does not bundle the chess engine or unpacked extension.",
            "Matching extension source: $sourceUrl",
            "Use SHA256SUMS.txt to verify the downloaded Setup file.",
            "Windows installation and browser end-to-end acceptance must be verified separately."
          ) -join "`n"
          gh release create "$env:RELEASE_TAG" "$env:ASSET_PATH" "$checksumPath" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "LC0 Bot Setup $env:RELEASE_VERSION" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release." }
