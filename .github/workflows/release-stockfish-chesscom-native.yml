name: Release Stockfish Chess.com Native Setup

on:
  push:
    branches: [main]
    paths:
      - "apps/stockfish/chesscom-native/native_host.py"
      - "apps/stockfish/chesscom-native/extension/manifest.json"
      - "apps/stockfish/chesscom-native/build-native-host.ps1"
      - "apps/stockfish/chesscom-native/requirements-build.txt"
      - "apps/stockfish/chesscom-native/STFBot.iss"
      - "apps/stockfish/chesscom-native/validate-release.py"
      - ".github/workflows/release-stockfish-chesscom-native.yml"

permissions:
  contents: write

concurrency:
  group: release-stf-bot-main
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: apps/stockfish/chesscom-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        run: |
          python -m py_compile native_host.py
          Get-Content -Raw extension/manifest.json | ConvertFrom-Json | Out-Null
          Get-ChildItem extension -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax failed: $($_.FullName)" }
          }

      - name: Build native host
        run: .\build-native-host.ps1

      - name: Validate native host artifact and release contract
        run: python validate-release.py

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Compute unique release version
        id: version
        run: |
          $version = [DateTime]::UtcNow.ToString('yyyy.MM.dd') + '.' + $env:GITHUB_RUN_NUMBER
          $tag = 'stfbot-v{0}-r{1}' -f $version, $env:GITHUB_RUN_ATTEMPT
          "value=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Build setup executable
        run: iscc "/DMyAppVersion=${{ steps.version.outputs.value }}" STFBot.iss

      - name: Validate setup artifact
        run: |
          $setup = "dist/STFBot-Setup-${{ steps.version.outputs.value }}.exe"
          if (-not (Test-Path $setup)) { throw "Setup artifact was not created: $setup" }
          if ((Get-Item $setup).Length -le 0) { throw "Setup artifact is empty: $setup" }

      - name: Validate and publish commit-bound GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          ASSET_PATH: apps/stockfish/chesscom-native/dist/STFBot-Setup-${{ steps.version.outputs.value }}.exe
          ASSET_NAME: STFBot-Setup-${{ steps.version.outputs.value }}.exe
        working-directory: .
        run: |
          if (-not (Test-Path -LiteralPath $env:ASSET_PATH -PathType Leaf)) { throw "Missing Setup executable: $env:ASSET_PATH" }
          if ((Get-Item -LiteralPath $env:ASSET_PATH).Length -le 0) { throw "Setup executable is empty." }
          $hash = (Get-FileHash -LiteralPath $env:ASSET_PATH -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = Join-Path (Split-Path -Parent $env:ASSET_PATH) "SHA256SUMS.txt"
          "$hash  $env:ASSET_NAME" | Set-Content -LiteralPath $checksumPath -Encoding ascii
          $sourceUrl = "https://github.com/$env:GITHUB_REPOSITORY/tree/$env:GITHUB_SHA/apps/stockfish/chesscom-native/extension"
          $notes = @(
            "Automated Windows Native Messaging host installer from main commit $env:GITHUB_SHA.",
            "",
            "This release contains the native host installer; it does not bundle the chess engine or unpacked extension.",
            "Matching extension source: $sourceUrl",
            "Use SHA256SUMS.txt to verify the downloaded Setup file.",
            "Windows installation and browser end-to-end acceptance must be verified separately."
          ) -join "`n"
          gh release create "$env:RELEASE_TAG" "$env:ASSET_PATH" "$checksumPath" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "STF Bot Setup $env:RELEASE_VERSION" --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish GitHub Release." }
